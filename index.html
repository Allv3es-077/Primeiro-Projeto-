<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Projeto | Calculadora</title>
    <style>
        *{
            margin: 0;
            padding: 0; 
            box-sizing: border-box; 
        }

        .fundo{
            width: 100%;
            height: 100vh;

            justify-content: center;
            background: linear-gradient(45deg, #020000,#380101);
            
            display: flex;
            font-family: Arial, Helvetica, sans-serif; 
            align-items: center;
        }

        .calculadora{
            width: 300px;
            height: 400px;
            background-color:rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            text-align: center;
              
        }

        .calculadora h1{
            color: #ffffff;
            font-size: 30px;
            margin-top: 10px;
        }

        table{
            margin: 10px auto;
            border-spacing: 3px;
        }

        .botao{
            width: 50px;
            height: 50px;
            font-size: 25px;
            cursor: pointer;
            background-color: rgb(31, 31, 31);
            border: none;
            color: #ffffff;
            border-radius: 3px;
            
        }

        .botao-zero{
            width: 103px;
        }

        .botao-igual{
            height: 103px;
        
        }

        .botao:hover{
            background-color: #ff0000;
            color: #ffffff;
        }

        #resultado{
            width: 209px;            
            height: 40px;
            background-color: #ffffff;
            margin: 10px auto;
            border-radius: 5px;
            font-size: 25px;
            color: #000000;
            text-align: right;
            padding: 5px;

        }

    </style>
</head>
<body>
    <div class="fundo">
    
    <div class="calculadora">
        
        <h1>Calculadora</h1>
        
        <p id="resultado"></p>
        
        <table>
            
            <tr>
                <td><button class="botao">C</button></td>
                <td><button class="botao">&lt</button></td>
                <td><button class="botao">/</button></td>
                <td><button class="botao">*</button></td>
            </tr>

             <tr>
                <td><button class="botao">7</button></td>
                <td><button class="botao">8</button></td>
                <td><button class="botao">9</button></td>
                <td><button class="botao">-</button></td>
            </tr>

            <tr>
                <td><button class="botao">4</button></td>
                <td><button class="botao">5</button></td>
                <td><button class="botao">6</button></td>
                <td><button class="botao">+</button></td>
            </tr>

             <tr>
                <td><button class="botao">1</button></td>
                <td><button class="botao">2</button></td>
                <td><button class="botao">3</button></td>
                <td rowspan="2">
                    <button class="botao botao-igual">=</button></td>           
            </tr>

             <tr>
                <td colspan="2">
                    <button class="botao botao-zero">0</button></td>
                <td>
                    <button class="botao">,</button>
                </td>               
            </tr>

        </table>
    </div>      
    </div>

    <script> 

            function calcular() {
                let resultado = document.getElementById("resultado");
                let botao = document.querySelectorAll(".botao");
                let valor = "";
                for(let i=0; i<botao.length; i++){
                botao[i].addEventListener("click", function(){
                    if(botao[i].innerHTML == "C"){
                    valor = "";
                    resultado.innerHTML = valor;
                    }else if(botao[i].innerHTML == "&lt"){
                    valor = valor.slice(0, -1);
                    resultado.innerHTML = valor;    
                    }else if(botao[i].innerHTML == "="){
                    valor = eval(valor);
                    resultado.innerHTML = valor;
                     }else{
                    valor += botao[i].innerHTML;
                    resultado.innerHTML = valor;
                }
            });
        }
    }
    calcular();
</script>
</body>
</html>
